<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="robots" content="noindex">
<title>ShopCall</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ShopCall">
<style>
  :root { --bg: #0A0B0D; --fg: #F1F2F3; --muted: #A9AFB6; --raised: #2F3135; --link: #7FB4EA; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); opacity: 0; transition: opacity .2s; }
  iframe.ready { opacity: 1; }
  /* the loading screen: Google builds the whole page (and its data) before it sends a byte, so without this
     the screen sits blank for several seconds and looks broken */
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px; color: var(--fg); font: 500 15px/1.5 Montserrat, system-ui, -apple-system, sans-serif; text-align: center; }
  #loader img { width: 220px; max-width: 70vw; height: auto; margin-bottom: 24px; }
  #loader .bar { width: 160px; height: 3px; border-radius: 2px; background: var(--raised); overflow: hidden; margin: 14px 0 0; }
  #loader .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--fg); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { #loader .bar i { animation-duration: 3s; } }
  #loader .slow { color: var(--muted); font-size: 13px; max-width: 320px; margin-top: 18px; min-height: 40px; }
  #loader a { color: var(--link); text-decoration: none; }
  #loader.done { display: none; }
  /* ShopCall's Scan view camera (2026-10-02): Google's frame never gets the camera, this page does. The Scan view says where its camera
     box is; the live video is drawn right over it, so the camera is in the Scan view. Touches pass through to ShopCall. */
  #cam { position: fixed; z-index: 5; display: none; overflow: hidden; border-radius: 10px; background: #000; pointer-events: none; transition: box-shadow .15s; }
  #cam.on { display: block; } #cam.ok { box-shadow: inset 0 0 0 4px #4FC38A; } #cam.bad { box-shadow: inset 0 0 0 4px #E5675B; }
  #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cam i { position: absolute; left: 50%; top: 50%; width: 62%; aspect-ratio: 1; max-height: 86%; transform: translate(-50%, -50%);
    background: linear-gradient(#F1F2F3,#F1F2F3) 0 0/22px 3px, linear-gradient(#F1F2F3,#F1F2F3) 0 0/3px 22px, linear-gradient(#F1F2F3,#F1F2F3) 100% 0/22px 3px, linear-gradient(#F1F2F3,#F1F2F3) 100% 0/3px 22px,
      linear-gradient(#F1F2F3,#F1F2F3) 0 100%/22px 3px, linear-gradient(#F1F2F3,#F1F2F3) 0 100%/3px 22px, linear-gradient(#F1F2F3,#F1F2F3) 100% 100%/22px 3px, linear-gradient(#F1F2F3,#F1F2F3) 100% 100%/3px 22px;
    background-repeat: no-repeat; }
</style>
</head>
<body>
<div id="loader" role="status">
  <img src="/icons/lockup-white.svg" alt="BSI ShopCall">
  <div>Loading ShopCall…</div>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="slow" id="slow"></div>
</div>
<!-- The BSI Shop Android app opens this page, so Android shows no
     address bar; the shop web app runs inside. shell=1 is what lets the Hub be framed. -->
<script>
  // Only Chromium lets the framed Google page see the signed-in account (Safari/iOS and Firefox block
  // third-party cookies, and Google sign-in refuses to load in a frame), so everything else goes to the app itself.
  var APP = 'https://script.google.com/a/macros/bsiproduction.com/s/AKfycbxU4dP5Pcshs_bNFCrWA14lU9Y85dZ4vX0VCn18IpWwaDOOUrm28rGKz6u4m5XyA8dT/exec';
  // where to go: a tag / label QR carries ?go=<a ShopCall page> (only BSI's own Apps Script pages are followed);
  // a ?p=… link opens that page of the crew app; plain / opens the app's front page (9/25: scanning opens the right page)
  var TARGET = APP, q = new URLSearchParams(location.search), go = q.get('go') || '';
  if (/^https:\/\/script\.google\.com\/a\/macros\/bsiproduction\.com\/s\/[A-Za-z0-9_-]+\/(exec|dev)(\?|$)/.test(go)) TARGET = go;
  else if (q.get('p')) { q.delete('go'); TARGET = APP + '?' + q.toString(); }
  var ua = navigator.userAgent, apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var slow = document.getElementById('slow');
  // a slow load says so, then offers a way out
  setTimeout(function () { slow.textContent = 'Still loading. The shop data can take a little while on a slow connection.'; }, 10000);
  setTimeout(function () { slow.innerHTML = 'Still loading. <a href="' + TARGET + '">Try again</a>'; }, 40000);
  if (/Chrome\/\d/.test(ua) && !apple) {
    var f = document.createElement('iframe');
    f.title = 'ShopCall';
    f.allow = 'camera; clipboard-write; fullscreen';
    f.onload = function () { f.className = 'ready'; document.getElementById('loader').className = 'done'; };
    f.src = TARGET + (TARGET.indexOf('?') === -1 ? '?' : '&') + 'shell=1';
    document.body.appendChild(f);
  } else {
    // Safari keeps this page on screen until Google's page arrives, so paint the loading screen first, then go
    requestAnimationFrame(function () { setTimeout(function () { location.replace(TARGET); }, 30); });
  }
</script>
<noscript><a href="https://script.google.com/a/macros/bsiproduction.com/s/AKfycbxU4dP5Pcshs_bNFCrWA14lU9Y85dZ4vX0VCn18IpWwaDOOUrm28rGKz6u4m5XyA8dT/exec" style="color:#F1F2F3">Open ShopCall</a></noscript>
<div id="cam" aria-hidden="true"><video id="camv" playsinline muted autoplay></video><i></i></div>
<script>
  // ShopCall's Scan view camera (2026-10-02, Tristan: "the camera visible in that scan view without opening a secondary camera view").
  // The Scan view (hub/ScanUi.html) asks cam-hello; this page answers cam-ready, then follows its cam-box reports (where the box is,
  // what the pinned bars cover) and draws the live camera there. Each code read goes down to the Scan view, which saves it as the
  // tech's own account and answers scan-result (the box flashes). No report for 1.5 s (a reload, another view) = the camera stops.
  (function () {
    var GUC = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
    var box = document.getElementById('cam'), v = document.getElementById('camv'), shop = null, origin = '*', starting = false, seen = 0, flashT = 0, detector = null;
    var cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true }), last = { t: '', at: 0 };
    function post(m) { if (shop) { m.via = 'shell'; try { shop.postMessage(m, origin); } catch (e) {} } }
    function stop() { try { (v.srcObject && v.srcObject.getTracks() || []).forEach(function (t) { t.stop(); }); } catch (e) {} v.srcObject = null; box.className = ''; starting = false; }
    function read() {
      if (!v.srcObject) return;
      if (v.readyState >= 2 && v.videoWidth) {
        if (detector) { detector.detect(v).then(function (c) { if (c && c[0] && c[0].rawValue) got(String(c[0].rawValue).trim()); }).catch(function () {}).then(function () { setTimeout(read, 120); }); return; }
        if (window.jsQR) {
          var w = v.videoWidth, h = v.videoHeight, s = Math.min(1, 720 / Math.max(w, h)); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
          cx.drawImage(v, 0, 0, cv.width, cv.height); var img = cx.getImageData(0, 0, cv.width, cv.height), code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
          if (code && code.data) got(String(code.data).trim());
        }
      }
      setTimeout(read, 120);
    }
    // a code held in view is one scan; it counts again once it has left the frame for 2 s
    function got(t) { var now = Date.now(); if (t === last.t && now - last.at < 2000) { last.at = now; return; } last = { t: t, at: now }; post({ bsi: 'scan', text: t.slice(0, 500) }); }
    function start() {
      if (starting || v.srcObject) return; starting = true;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { starting = false; return post({ bsi: 'cam-error', what: 'This browser can\'t use the camera. Type the code below.' }); }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (st) {
        starting = false; if (Date.now() - seen > 1500) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
        v.srcObject = st; v.play().catch(function () {}); read();
      }).catch(function (err) {
        starting = false; var no = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
        post({ bsi: 'cam-error', what: no ? 'The camera is blocked: allow it for bsiproduction.github.io in the browser\'s site settings.' : 'The camera didn\'t start (' + (err && err.name || 'unknown') + ').' });
      });
    }
    function place(d) {
      var f = document.querySelector('iframe'); if (!f) return;
      var fr = f.getBoundingClientRect(), dy = fr.top + Math.max(0, fr.height - (+d.vh || fr.height)), dx = fr.left;   // a banner above Google's page, if any
      var x = +d.x + dx, y = +d.y + dy, w = +d.w, h = +d.h, top = +d.clipTop + dy, bot = +d.clipBottom + dy;
      if (!(w > 0 && h > 0)) return;
      box.style.left = x + 'px'; box.style.top = y + 'px'; box.style.width = w + 'px'; box.style.height = h + 'px';
      box.style.clipPath = 'inset(' + Math.max(0, top - y) + 'px 0 ' + Math.max(0, y + h - bot) + 'px 0 round 10px)';
      if (box.className.indexOf('on') === -1) box.className = 'on';
    }
    window.addEventListener('message', function (e) {
      var d = e.data || {}; if (!GUC.test(e.origin) || typeof d.bsi !== 'string') return;
      shop = e.source; origin = e.origin;
      if (d.bsi === 'cam-hello') return post({ bsi: 'cam-ready' });
      if (d.bsi === 'cam-box') { seen = Date.now(); place(d); start(); }
      if (d.bsi === 'cam-off') { seen = 0; stop(); }
      if (d.bsi === 'scan-result') { box.className = 'on ' + (d.bad ? 'bad' : 'ok'); clearTimeout(flashT); flashT = setTimeout(function () { if (v.srcObject) box.className = 'on'; }, 900);
        if (navigator.vibrate) { try { navigator.vibrate(d.bad ? [60, 60, 60] : 40); } catch (x) {} } }
    });
    setInterval(function () { if (seen && Date.now() - seen > 1500) { seen = 0; stop(); } }, 500);
    document.addEventListener('visibilitychange', function () { if (document.hidden) { seen = 0; stop(); } });
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    if (!detector) { var s = document.createElement('script'); s.src = '/scan/jsQR.js'; document.head.appendChild(s); }
  })();
</script>
</body>
</html>
