<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="robots" content="noindex">
<title>ShopCall · Camera</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- ShopCall's live camera (2026-10-02, Tristan: "it needs to be quick and not require actual photos to be taken").
     ShopCall runs inside Google's Apps Script frame, which never lets a page use the camera. This page is ShopCall's own, so the
     camera works here: ShopCall's Scan view opens it in its own window, it reads codes continuously (BarcodeDetector, else jsQR),
     and hands each one to the ShopCall tab that opened it (postMessage). ShopCall does the write as the tech's own account and
     sends back what happened, which shows here. Nothing is saved by this page; it never talks to Google itself. -->
<style>
  :root { --bg: #0A0B0D; --fg: #F1F2F3; --muted: #A9AFB6; --raised: #2F3135; --ok: #4FC38A; --bad: #E5675B; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 15px/1.45 Montserrat, system-ui, -apple-system, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .frame { position: fixed; left: 50%; top: 42%; width: min(64vw, 56vh, 320px); aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.42); outline: 3px solid var(--fg); transition: outline-color .15s; }
  .frame.ok { outline-color: var(--ok); } .frame.bad { outline-color: var(--bad); }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background: linear-gradient(rgba(0,0,0,.85), rgba(0,0,0,.5)); }
  .top .what { flex: 1 1 auto; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; font-weight: 600; color: var(--fg); background: var(--raised); border: 0; border-radius: 6px; padding: 0 18px; height: 44px; cursor: pointer; flex: none; }
  button:focus-visible { outline: 2px solid #7FB4EA; outline-offset: 2px; }
  .card { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(20,21,24,.94); border-radius: 12px; padding: 14px 16px;
    border-top: 4px solid var(--raised); min-height: 64px; }
  .card.ok { border-top-color: var(--ok); } .card.bad { border-top-color: var(--bad); }
  .card .t { font-size: 19px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .card .w { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .card.bad .w { color: var(--bad); }
  .card .n { color: var(--muted); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="frame" id="frame" aria-hidden="true"></div>
<div class="top"><div class="what" id="what">Scan</div><button type="button" id="done">Done</button></div>
<div class="card" id="card" role="status" aria-live="polite"><div class="t" id="t">Starting the camera…</div><div class="w" id="w"></div><div class="n" id="n"></div></div>
<script>
  // ShopCall's pages are served from Google's user-content domain; a message from anywhere else is ignored
  var SHOPCALL = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var opener = window.opener, shop = null;   // the ShopCall window (its frame), learned from its first message
  var v = document.getElementById('v'), frame = document.getElementById('frame');
  var c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  var detector = null, last = { text: '', at: 0 }, waiting = 0, n = 0, flashT = 0;
  function $(id) { return document.getElementById(id); }
  function show(cls, t, w) { $('card').className = 'card' + (cls ? ' ' + cls : ''); $('t').textContent = t || ''; $('w').textContent = w || ''; }
  function flash(cls) { frame.className = 'frame ' + cls; clearTimeout(flashT); flashT = setTimeout(function () { frame.className = 'frame'; }, 900); }
  function send(msg) { try { (shop || opener).postMessage(msg, '*'); return true; } catch (e) { return false; } }
  function closeMe() { stop(); try { if (opener && !opener.closed) opener.focus(); } catch (e) {} window.close();
    show('', 'You can close this tab', 'Go back to ShopCall.'); }
  $('done').onclick = function () { send({ bsi: 'scan-done' }); closeMe(); };

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!SHOPCALL.test(e.origin) || typeof d.bsi !== 'string') return;
    shop = e.source;
    if (d.bsi === 'scan-mode') { $('what').textContent = String(d.title || 'Scan').slice(0, 120); if (!waiting && !n) show('', String(d.hint || 'Point at a code').slice(0, 200), ''); }
    if (d.bsi === 'scan-result') {
      waiting = 0; n++;
      show(d.bad ? 'bad' : 'ok', String(d.title || '').slice(0, 120), String(d.what || '').slice(0, 300));
      $('n').textContent = d.typing ? 'Type the number in ShopCall.' : '';
      flash(d.bad ? 'bad' : 'ok');
      if (navigator.vibrate) { try { navigator.vibrate(d.bad ? [60, 60, 60] : 40); } catch (x) {} }
    }
    if (d.bsi === 'scan-close') closeMe();
  });

  function got(text) {
    var now = Date.now();
    if (text === last.text && now - last.at < 3000) return;   // the same code held in view is one scan
    last = { text: text, at: now };
    if (!opener || opener.closed) { show('bad', 'ShopCall isn\'t open', 'Open Scan in ShopCall again; it opens this camera.'); return; }
    waiting = now; show('', 'Saving…', ''); flash('ok');
    if (!send({ bsi: 'scan', text: text.slice(0, 500) })) show('bad', 'Couldn\'t reach ShopCall', 'Open Scan in ShopCall again.');
    setTimeout(function () { if (waiting === now) show('bad', 'No answer from ShopCall yet', 'Check the ShopCall tab is still open.'); }, 12000);
  }
  function tick() {
    if (!v.srcObject) return;
    if (v.readyState >= 2 && v.videoWidth) {
      if (detector) {
        detector.detect(v).then(function (codes) { if (codes && codes[0] && codes[0].rawValue) got(String(codes[0].rawValue).trim()); }).catch(function () {}).then(function () { setTimeout(tick, 120); });
        return;
      }
      if (window.jsQR) {
        var w = v.videoWidth, h = v.videoHeight, s = Math.min(1, 720 / Math.max(w, h));
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        ctx.drawImage(v, 0, 0, c.width, c.height);
        var img = ctx.getImageData(0, 0, c.width, c.height), code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) got(String(code.data).trim());
      }
    }
    setTimeout(tick, 120);
  }
  function stop() { try { (v.srcObject && v.srcObject.getTracks() || []).forEach(function (t) { t.stop(); }); } catch (e) {} v.srcObject = null; }
  function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return show('bad', 'No camera here', 'This browser can\'t use the camera. Type the code in ShopCall.');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (stream) {
      v.srcObject = stream; v.play().catch(function () {});
      if (!n && !waiting) show('', 'Point at a code', 'Each scan saves in ShopCall and shows here.');
      tick();
    }).catch(function (err) {
      var denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      show('bad', denied ? 'The camera is blocked' : 'The camera didn\'t start', denied ? 'Tap Allow when asked, or turn the camera on for bsiproduction.github.io in the browser\'s site settings.' : 'Close other apps using the camera and try again (' + (err && err.name || 'unknown') + ').');
    });
  }
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
  if (!detector) { var s = document.createElement('script'); s.src = '/scan/jsQR.js'; document.head.appendChild(s); }
  // a phone that locks or switches apps stops the camera; it starts again when this page is back
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else if (!v.srcObject) start(); });
  if (!opener) show('bad', 'Open this from ShopCall', 'In ShopCall: Scan, then Open the camera.');
  else { send({ bsi: 'scan-hello' }); start(); }
</script>
</body>
</html>
