<!DOCTYPE html>
<!-- The crew's Confirm / Can't make it page. BUILT from bsi-shop-systems crewconfirm/Page.html by tools/build-confirm-page.js:
     change Page.html and rebuild. It draws the call and talks to the confirm app's doPost by fetch (no Google cookies), so a phone
     signed in to several Google accounts still works (2026-10-07). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>BSI Production · your call</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  /* BSI crew confirm: one card, phone first. ShopCall's daylight colours (freelancers open it from an email, most in daylight). */
  :root { --bg: #F4F5F7; --card: #FFFFFF; --fg: #17191C; --muted: #4E545C; --border: #D9DCE1; --ok: #187A49; --ok-bg: #E7F4EC; --danger: #C2372F; --danger-bg: #FBEAE8; --warn: #8F5A00; --warn-bg: #FFF5E0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0A0B0D; --card: #15171B; --fg: #F1F2F3; --muted: #A9AFB6; --border: #30353C; --ok: #4FC38A; --ok-bg: #11271C; --danger: #F27A72; --danger-bg: #2E1614; --warn: #F2A93B; --warn-bg: #2B2010; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; padding: 24px 16px 48px; }
  main { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; }
  .brand { font-weight: 700; letter-spacing: .08em; font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
  h1 { font-size: 24px; margin: 0; line-height: 1.25; }
  .hi { margin: 0; color: var(--muted); }
  .call { border-top: 1px solid var(--border); padding-top: 12px; display: grid; gap: 2px; }
  .call .d { font-weight: 600; }
  .call .m { color: var(--muted); font-size: 14px; }
  .btns { display: grid; gap: 10px; }
  button { font: inherit; font-weight: 600; font-size: 17px; min-height: 52px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; padding: 0 16px; }
  button.yes { background: var(--fg); color: var(--card); border-color: var(--fg); }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: default; }
  textarea { font: inherit; font-size: 16px; width: 100%; min-height: 72px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--bg); color: var(--fg); }
  label { font-size: 14px; color: var(--muted); }
  .state { border-radius: 10px; padding: 12px 14px; font-weight: 600; }
  .state.ok { background: var(--ok-bg); color: var(--ok); }
  .state.cant { background: var(--danger-bg); color: var(--danger); }
  .state.test { background: var(--warn-bg); color: var(--warn); font-weight: 500; }
  .state small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .change { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 44px; font-size: 15px; font-weight: 500; justify-self: start; padding: 0; }
  .call .no { color: var(--danger); font-weight: 600; font-size: 14px; }
  .state.some { background: var(--warn-bg); color: var(--warn); }
  .days { display: grid; gap: 8px; margin: 0; padding: 0; border: 0; }
  .days legend { font-size: 14px; color: var(--muted); padding: 0; margin-bottom: 4px; }
  .day { display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
  .day:has(input:checked) { border-color: var(--ok); background: var(--ok-bg); }
  .day input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--ok); }
  .day span { display: grid; line-height: 1.35; }
  .day small { color: var(--muted); font-size: 14px; }
  .day input[type="radio"] { accent-color: var(--fg); }
  .day:has(input[type="radio"]:checked) { border-color: var(--fg); background: var(--bg); }
  /* a day with a call back (2026-10-28): its two calls together under the day */
  .pair { display: grid; gap: 8px; }
  .pair .ph { font-size: 14px; font-weight: 600; margin-top: 4px; }
  .call .cb { display: grid; gap: 2px; margin-top: 6px; }
  .err { color: var(--danger); font-size: 15px; margin: 0; }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">BSI Production · crew call</div>
  <div class="card" id="card"></div>
  <p class="foot">Questions about the call? Reply to the email or call the office.</p>
</main>
<script>
  var APP = "https://script.google.com/macros/s/AKfycbypUwp2NADxPLl_sZUEhd5EA-7SeTo94hdNF4DMNqu0J4f549WC7S4Tz_uhTWlZ30LE/exec";
  var TOKEN = (function () { var t = (new URLSearchParams(location.search).get('t') || '').trim().toLowerCase(); return /^[a-f0-9]{40}$/.test(t) ? t : ''; })();
  var DIRECT = APP + (TOKEN ? '?t=' + TOKEN : '');
  var MODEL = null, ASK = '', BUSY = false, ERR = '', DONE = null, PICK = {};
  /** The confirm app's doPost: a cross-site fetch carries no Google cookies, so whichever accounts the phone is signed in to never matter. */
  function api(body) {
    return fetch(APP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error('Couldn\'t reach the office (' + r.status + '). Try again in a minute.'); return r.json(); })
      .then(function (j) { if (!j || j.ok !== true) throw new Error((j && j.error) || 'No answer from the office.'); return j.data; });
  }
  var CHOICE = 'all';   // a one-day pair's can't-make-it pick: 'all' | 'first' | 'back' (2026-10-28)
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function paint() {
    var m = MODEL, el = document.getElementById('card');
    if (!m) { el.innerHTML = ERR ? '<h1>Couldn\'t load your call</h1><p class="hi">' + esc(ERR) + '</p><p class="hi"><a href="' + esc(DIRECT) + '">Open it directly</a>, or reply to the email.</p>'
      : '<p class="hi" role="status">Loading your call…</p>'; return; }
    if (m.bad) { el.innerHTML = '<h1>This link can\'t be used</h1><p class="hi">' + esc(m.bad) + '</p>'; return; }
    // a call back (2026-10-28): its line carries back + of (its first call's id); the pair is drawn together under its day
    var G = groups(m.lines), backs = m.lines.some(function (l) { return l.back; }), pair = pairOnly(G);
    var noMark = function (l) { return m.answer === 'some' && l.state === 'cant' ? '<span class="no">You can\'t make this ' + (backs ? 'call' : 'day') + '</span>' : ''; };
    var meta = function (l) { return '<span class="m">' + esc(l.place) + (l.meals ? ' · meals ' + esc(l.meals) : '') + '</span>'; };
    var calls = G.map(function (g) { var l = g.a;
      if (!g.b) return '<div class="call"><span class="d">' + esc(l.day) + '</span>' + noMark(l) + '<span>' + esc(l.role) + ' · ' + (l.back ? 'Call back ' : '') + esc(l.hours) + '</span>' + meta(l) + '</div>';
      return '<div class="call"><span class="d">' + esc(l.day) + '</span>' + noMark(l) + '<span>' + esc(l.role) + ' · ' + esc(l.hours) + '</span>' + meta(l) +
        '<div class="cb">' + noMark(g.b) + '<span>Call back ' + esc(g.b.hours) + '</span>' + (g.b.place !== l.place ? '<span class="m">' + esc(g.b.place) + '</span>' : '') + '</div></div>'; }).join('');
    var head = '<h1>' + esc(m.gig) + '</h1><p class="hi">' + (m.first ? 'Hi ' + esc(m.first) + '. ' : '') + 'Your call' + (m.lines.length === 1 ? '' : 's') + ' on this job:</p>' + calls;
    var state = '';
    if (DONE && DONE.test) state = '<div class="state test">This is a test link, so nothing was saved.<small>Real links work once the office turns on sending to crew.</small></div>';
    else if (m.answer === 'confirmed') state = '<div class="state ok">You\'re confirmed. Thank you!<small>If that changes, tap below and let us know.</small></div>';
    else if (m.answer === 'some') { var n = m.lines.filter(function (l) { return l.state === 'confirmed'; }).length;
      var made = pair ? (pair.a.state === 'confirmed' ? 'You can make the first call, not the call back.' : 'You can make the call back, not the first call.')
        : 'You can make ' + n + ' of ' + m.lines.length + (backs ? ' calls.' : ' days.');
      state = '<div class="state some">' + made + ' Thank you!' + (m.reason ? '<small>' + esc(String(m.reason).replace(/^'/, '')) + '</small>' : '') + '<small>The office has been told and will find someone for the other ' + (pair ? 'call' : backs ? 'calls' : 'days') + '.</small></div>'; }
    else if (m.answer === 'cant') state = '<div class="state cant">You told us you can\'t make it.' + (m.reason ? '<small>' + esc(String(m.reason).replace(/^'/, '')) + '</small>' : '') + '<small>The office has been told. Tap below if you can after all.</small></div>';
    var answered = (m.answer === 'confirmed' || m.answer === 'cant' || m.answer === 'some') && !ASK;
    var why = function (ph) { return '<label for="why">Anything the office should know? (optional)</label><textarea id="why" maxlength="200" placeholder="' + ph + '"></textarea>'; };
    var back = '<button type="button" onclick="ASK=\'change\'; paint()">Back</button>';
    var tick = function (l, title, sub) { return '<label class="day"><input type="checkbox" onchange="PICK[this.value]=this.checked" value="' + esc(l.id) + '"' + (PICK[l.id] ? ' checked' : '') + '><span>' + title + '<small>' + sub + '</small></span></label>'; };
    var btns = answered ? '<button type="button" class="change" onclick="ASK=\'change\'; paint()">Change my answer</button>' :
      // a one-day pair: the three answers Tristan asked for (10/28); any of it = cant, one half = some with that half's row
      ASK === 'cant' && pair ? '<fieldset class="days"><legend>Which part can\'t you make?</legend>' +
          radio('all', 'Can\'t make any of it', 'Neither call') +
          radio('first', 'First call only' + (at(pair.a) ? ' (' + esc(at(pair.a)) + ')' : ''), 'I can make ' + esc(pair.a.hours) + ', not the call back') +
          radio('back', 'Call back only' + (at(pair.b) ? ' (' + esc(at(pair.b)) + ')' : ''), 'I can make ' + esc(pair.b.hours) + ', not the first call') + '</fieldset>' +
        why('e.g. another gig that morning') +
        '<div class="btns"><button type="button" class="yes" id="go" onclick="sendPair()"' + (BUSY ? ' disabled' : '') + '>' + (BUSY ? 'Sending…' : goWords()) + '</button>' + back + '</div>' :
      ASK === 'cant' ? why('e.g. another gig that day') +
        '<div class="btns"><button type="button" class="yes" onclick="send(\'cant\')"' + (BUSY ? ' disabled' : '') + '>' + (BUSY ? 'Sending…' : 'Send: I can\'t make it') + '</button>' +
          (m.some && backs ? '<button type="button" onclick="pickDays()"' + (BUSY ? ' disabled' : '') + '>I can make some of it</button>' : '') + back + '</div>' :
      ASK === 'some' ? '<fieldset class="days"><legend>' + (backs ? 'Tick the calls you can work' : 'Tick the days you can work') + '</legend>' + G.map(function (g) {
          if (!g.b) return tick(g.a, esc(g.a.day), esc(g.a.role) + ' · ' + (g.a.back ? 'Call back ' : '') + esc(g.a.hours));
          return '<div class="pair"><span class="ph">' + esc(g.a.day) + '</span>' + tick(g.a, 'First call', esc(g.a.role) + ' · ' + esc(g.a.hours)) + tick(g.b, 'Call back', esc(g.b.hours)) + '</div>'; }).join('') + '</fieldset>' +
        why('e.g. another gig on Saturday') +
        '<div class="btns"><button type="button" class="yes" onclick="send(\'some\')"' + (BUSY ? ' disabled' : '') + '>' + (BUSY ? 'Sending…' : backs ? 'Send my calls' : 'Send my days') + '</button>' + back + '</div>' :
      '<div class="btns"><button type="button" class="yes" onclick="send(\'confirmed\')"' + (BUSY ? ' disabled' : '') + '>' + (BUSY ? 'Sending…' : 'Confirm') + '</button>' +
        (m.some && !pair ? '<button type="button" onclick="pickDays()"' + (BUSY ? ' disabled' : '') + '>' + (backs ? 'I can make some of it' : 'I can make some days') + '</button>' : '') +
        '<button type="button" onclick="CHOICE=\'all\'; ASK=\'cant\'; paint()"' + (BUSY ? ' disabled' : '') + '>I can\'t make it</button></div>';
    el.innerHTML = head + state + btns + (ERR ? '<p class="err" role="alert">' + esc(ERR) + '</p>' : '');
  }
  /** The lines as the page draws them: [{a, b}] where b is a's call back (a line whose of is a's id); a call back whose first call
   *  isn't theirs stands alone. Order kept (the server puts a call back after its date's other lines). */
  function groups(lines) {
    var byId = {}, out = [];
    lines.forEach(function (l) { if (!l.back) { var g = { a: l, b: null }; byId[l.id] = g; out.push(g); } });
    lines.forEach(function (l) { if (l.back) { var g = byId[l.of]; if (g && !g.b) g.b = l; else out.push({ a: l, b: null }); } });
    return out.sort(function (x, y) { return lines.indexOf(x.a) - lines.indexOf(y.a); });
  }
  /** The call is one day with a call back and nothing else: the pair, else null. */
  function pairOnly(G) { return G.length === 1 && G[0].b ? G[0] : null; }
  /** "7 AM – 12 PM" -> "7 AM"; "call time to come" -> "". */
  function at(l) { return /\d/.test(l.hours) ? String(l.hours).split(' – ')[0] : ''; }
  function radio(v, title, sub) { return '<label class="day"><input type="radio" name="part" value="' + v + '" onchange="CHOICE=this.value; var b=document.getElementById(\'go\'); if (b) b.textContent=goWords()"' + (CHOICE === v ? ' checked' : '') + '><span>' + title + '<small>' + sub + '</small></span></label>'; }
  function goWords() { return CHOICE === 'all' ? 'Send: I can\'t make it' : 'Send my answer'; }
  function sendPair() {
    var p = pairOnly(groups(MODEL.lines)); if (!p) return;
    if (CHOICE === 'all') return send('cant');
    PICK = {}; PICK[(CHOICE === 'first' ? p.a : p.b).id] = true; send('some');
  }
  // start from what they told us before (a some-days answer), else nothing ticked
  function pickDays() { PICK = {}; if (MODEL.answer === 'some') MODEL.lines.forEach(function (l) { if (l.state === 'confirmed') PICK[l.id] = true; }); ASK = 'some'; ERR = ''; paint(); }
  function send(choice) {
    if (BUSY) return;
    var why = document.getElementById('why'), whyText = why ? why.value : '';
    var can = Object.keys(PICK).filter(function (k) { return PICK[k]; });
    if (choice === 'some' && !can.length) { ERR = MODEL.lines.some(function (l) { return l.back; }) ? 'Tick at least one call you can work.' : 'Tick at least one day you can work.'; paint(); return; }
    BUSY = true; ERR = ''; paint();
    if (why) document.getElementById('why').value = whyText;
    api({ fn: 'answer', t: TOKEN, choice: choice, reason: whyText, can: can })
      .then(function (r) { BUSY = false; ASK = ''; DONE = r; MODEL = r.model; paint(); })
      .catch(function (e) { BUSY = false; ERR = (e && e.message) || 'That didn\'t go through. Try again.'; paint(); });
  }
  paint();
  if (!TOKEN) { MODEL = { bad: 'This link isn\'t complete. Open it again from your email.' }; paint(); }
  else api({ fn: 'view', t: TOKEN }).then(function (m) { MODEL = m; paint(); }).catch(function (e) { ERR = (e && e.message) || 'No answer from the office.'; paint(); });
</script>
</body>
</html>
