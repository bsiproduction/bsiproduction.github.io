<style>
/* ============================================================
   Console themes — docs/ui-standards.md §4. GRAPHITE IS CANONICAL. 2026-10-08: tungsten, worklight, festival (dark) and callsheet (light) from
   the theme pitch (Tristan's four picks), each measured by tools/theme-contrast-test.js; a light theme is also listed in UiStyles' LIGHT HEADERS selectors. ahm is
   UNTESTED until Settings ships a theme switcher: do not tune it (one exception: its danger, audit B-10, 2026-10-08). daylight got
   its page stones and readable header on 9/25 (Tristan's call), its white header
   with a stone edge and its department colours on 9/29 ("C"); the rest of it
   follows the suite's shared light values (kit/design/tokens.json).
   COLOR VALUES ONLY, one block per theme. Spacing, type, radii,
   surfaces and components live in UiStyles.html. Adding a theme =
   copy one [data-theme] block and fill every role.
   ============================================================ */
:root {
  /* ---- graphite (canonical, 2026-09-17 "C"): a stage with the house lights down. Near-black
     base; the few colors that appear are things lit on it. Color means attention (severity),
     done (a moment, never a list), or gig identity (tape). ---- */
  --bg-base: #0A0B0D;  --bg-raised: #15171B;  --bg-sunken: #050607;
  --fg: #F1F2F3;       --fg-muted: #A9AFB6;   --fg-faint: #7D848C;
  --border: #22262B;   --border-strong: #30353C;
  --accent: #7FB4EA;   --accent-fg: #06121F;
  /* status values are the suite's shared ones (bsi-app-updates kit/design/tokens.json, 2026-09-25): every one passes 4.5:1
     on the floor, the wells AND the hero. Danger was #EB5B52 (3.8:1 on the hero) — now one step lighter. */
  --warn: #F2A93B;     --ok: #4FC38A;         --danger: #F27A72;   --info: #7FB4EA;
  --warn-fg: #1A1200;  --danger-fg: #0B0C0E;  /* text on a warn / danger fill (armed buttons) */
  --done: #3BC0AE;     --done-fg: #04211C;    /* complete / clear — moments only */
  /* VIEW IDENTITY (2026-09-23, Tristan: "something that tells someone which view they're looking at quickly"): each page's
     own color, on the page's FRAME only — the header's tint, the view name's icon, the tab bar's current tab, a well's top
     edge. Never on content, rows or chips (those colors mean attention, done or tape). Light hue / deep tint per page.
     Chosen by measurement (2026-09-23 critique): every page hue is PASTEL and >= dE00 17 from warn / danger / done / ok /
     link / every tape (tape is saturated, a page hue never is); the name + icon always carry the page too (under red-green
     color blindness some page hues merge).
     MINERAL (2026-09-24, Tristan picked it from 11 options: design/header-palettes-2026-09-24/): stone names. Every hue
     >= dE00 17.0 from every state / tape (inventory vs ok is the tightest); closest two pages 11.3 (was 9.2).
     Check a change with: node design/header-palettes-2026-09-24/tools/de.js <palettes.json> */
  --v-today: #D4C6A1; --v-today-deep: #312B1A;   /* sandstone */
  --v-gigs: #CFCAFF; --v-gigs-deep: #2B293A;   /* lapis (a lilac-lapis: a truer blue sits on the link) */
  --v-projects: #FAB598; --v-projects-deep: #38271F;   /* coral */
  --v-board: #F3B0D3; --v-board-deep: #37252E;   /* rose quartz */
  --v-inventory: #BEE6CF; --v-inventory-deep: #1E3026;   /* jade */
  --v-approvals: #E9ADFE; --v-approvals-deep: #312735;   /* amethyst */
  --v-errors: #FCB0B2; --v-errors-deep: #392526;   /* rhodochrosite (rose: errors keep the red family) */
  --v-calendar: #B4D76B; --v-calendar-deep: #282E1D;   /* citrine */
  --v-tasks: #A0E1EE; --v-tasks-deep: #1C2E32;   /* aquamarine, brought into the family (R5.10): was #28DEFE, s 99% l 58% (the others l 63-90%); now s 70% l 78%, 17.2 from the nearest fixed hue, 14.5 from the nearest page */
  --v-notes: #A0A8A0; --v-notes-deep: #2B2E2B;   /* pewter (kept; 15.5 from today) */
  --v-feedback: #DEECB8; --v-feedback-deep: #292E1D;   /* peridot (was lime: lime sat 9.6 from citrine; 11.3 from jade) */
  --v-orders: #B8C4A6; --v-orders-deep: #272923;   /* prehnite (sage, Tristan 2026-09-24): 17.3 from ok, 10.5 from today */
  /* suite round B (2026-09-25): the wall and sub-rentals get their own stone; the item page, the timeline and the truck plan
     ride their parent's (inventory / gigs), so a scan lands on a familiar frame */
  --v-wall: #E8D8B0; --v-wall-deep: #2E2A1E;   /* travertine */
  --v-subrentals: #C9D6E8; --v-subrentals-deep: #262B33;   /* moonstone */
  --v-installs: #9696A2; --v-installs-deep: #26262D;   /* slate (Installs, 2026-10-02): 19.2 from the nearest fixed hue (danger), 12.6 from the nearest page (the pastel band is full; the closest existing pair is 11.3) */
  --v-walls: #C880B0; --v-walls-deep: #33242D;   /* kunzite (LED walls, Tristan picked it 10/2 from four, design/walls-2026-10-02/hues.png): 19.8 from danger, 13.2 from Shop Board */
  --v-news: #B9946E; --v-news-deep: #302819;   /* tiger's eye (News, 2026-10-04): 15.0 ΔE00 from the nearest page (config), every brighter hue sits on warn or calendar; the band is full */
  --v-reports: #8FB3C4; --v-reports-deep: #1E2A30;   /* labradorite (Reports, round 5): 16.2 from moonstone, 16.5 from pewter */
  /* R3.5 (2026-09-28): the desk tools reached from the Desk menu get their own hue (they borrowed Today's). Measured like the
     rest: ≥ ΔE00 17 from warn, danger, done, ok, link and every tape; ≥ 12 from every other page hue */
  --v-config: #C6ADA9; --v-config-deep: #332A29;   /* morganite (a dusty rose-taupe): 17.4 from the nearest fixed hue, 13.2 from errors */
  --v-registry: #AA9BD4; --v-registry-deep: #29263A;   /* iolite (a grey violet): 17.6 from link, 12.2 from gigs */
  --v-patches: #BDA9C6; --v-patches-deep: #2D2733;   /* lepidolite (Patch, 2026-09-27 proposal): 19.9 from white tape, 11.9 from rose quartz */
  /* DEPARTMENTS (crew calls, 2026-09-28, Tristan: "sorted by department into different colors"): identity on the crew day
     timeline's bars and the role marks beside them, never on status. A categorical set checked with the dataviz validator on
     --bg-raised (lightness band, chroma, CVD and normal-vision separation of neighbours, >= 3:1 contrast: all pass in this
     order) and kept clear of the reserved hues: no red / amber / teal (Lighting is olive-gold, not yellow: 22.7 from warn,
     31.6 from done). Every place a colour shows also names the department in words. */
  --dept-audio: #3987E5; --dept-lighting: #8F9318; --dept-video: #9085E9; --dept-staging: #008300; --dept-management: #D55181; --dept-other: #6F7680;
  /* three tiers on near-black: hero lit, queue lifted, reference barely off the floor */
  /* hero = what the C lab actually rendered (the old tuning block's color-mix outranked the token) */
  /* hairlines ON the hero surface: --border-strong vanished on it (round 2 step 5) */
  --border-hero: #44474C; --border-strong-hero: #53575D;
  --surface-hero: #2F3135; --surface-queue: #121418; --surface-ref: #0E1013;
  /* timeline phases by lightness, not hue (2026-09-22: violet/blue/sea read as stock palette and put a
     blue beside blue tape and blue links): prep = outline, out = lit, intake = dim */
  --phase-prep: #0A0B0D; --phase-prep-fg: #A9AFB6; --phase-prep-edge: #7D848C;
  --phase-out: #8A9099;  --phase-out-fg: #0A0B0D;  /* brightest phase, but below the hero: reference data is never lit brighter than the work */
  --phase-intake: #3A3F46; --phase-intake-fg: #D9DCE0;
  /* meter: lit segments are neutral while a pull is in progress; done when complete */
  /* R5.5 (2026-09-28): the empty track shows the bar's length (it was #23272D, 1.2:1): 3.06:1 on a well, and its own value on
     the lit hero (3.06:1 there); field outlines get the same ~3:1 edge (they were --border-strong, 1.45:1) */
  /* K8 (Tristan 9/28): softened to about 2:1 — the track 1.90 on bg-raised (where most tracks and fields sit), 1.95 on a queue
     card, 2.08 on the floor; the hero's track 2.00 on the hero. 3:1 was brighter than he wanted */
  --meter-lit: #D9DCE0; --meter-off: #43464D; --meter-off-hero: #5A5E65;
  --field-edge: #43464D;
  /* the truck's pink (Tristan 9/24) no longer borrows Shop Board's page hue (#F3B0D3 was the same hex): a saturated pink that is
     no page colour (ΔE00 16.7 from the nearest page hue, 20 from every state and tape); the bar's words say "on the truck" */
  --meter-truck: #E967BE;
  color-scheme: dark;

}
[data-theme="ahm"] {
  /* ---- charcoal, the reference's cyan; attention stays amber ---- */
  --bg-base: #1C2426;  --bg-raised: #232D30;  --bg-sunken: #151C1E;
  --fg: #F1F4F4;       --fg-muted: #B2C1C3;   --fg-faint: #8FA3A6;
  --border: #2F3C3F;   --border-strong: #3C4B4F;
  --accent: #4FC3E8;   --accent-fg: #04191F;
  /* audit B-10 (2026-10-08): danger was #E5524A, 3.78:1 on a well ("double-booked" on Crew calls); now graphite's value, 5.24:1 on a
     well, 5.87 on the floor, 4.43 on the hero; armed danger buttons take graphite's dark words on it (white was 2.7:1) */
  --warn: #F2A93B;     --ok: #5CCB8F;         --danger: #F27A72;   --info: #4FC3E8;
  --warn-fg: #1A1200;  --danger-fg: #0B0C0E;
  --done: #3FC9B4;     --done-fg: #04211C;
  /* hairlines ON the hero surface: --border-strong vanished on it (round 2 step 5) */
  --border-hero: #415156; --border-strong-hero: #4E6066;
  --surface-hero: #2C393D; --surface-queue: #232D30; --surface-ref: #1F282A;
  --phase-prep: #5B4FC4; --phase-prep-fg: #F0EDFF; --phase-prep-edge: #5B4FC4;
  --phase-out: #2F6FC8;  --phase-out-fg: #F3F7FE;
  --phase-intake: #1F7F8C; --phase-intake-fg: #EAF7F9;
  --meter-lit: #E3EAEA; --meter-off: #2F3C3F; --meter-off-hero: #2F3C3F; --field-edge: #3C4B4F;
}
[data-theme="daylight"] {
  /* ---- light; same roles, same meanings ---- */
  --bg-base: #F4F5F6;  --bg-raised: #FFFFFF;  --bg-sunken: #E9EBEE;
  /* audit B-10 (2026-10-08): muted was #4E545C; a pill's count draws it at 80% (UiStyles .seg button .num) and that was 4.30:1 on
     the floor ("4/20" on the pull's department chips); #454A51 is 4.84:1 there at 80%, 8.2:1 at full */
  --fg: #17191C;       --fg-muted: #454A51;   --fg-faint: #646A73;
  --border: #D9DCE1;   --border-strong: #C3C8CF;
  --accent: #2F6FA8;   --accent-fg: #FFFFFF;
  /* the suite's shared light values (kit/design/tokens.json): the old warn / ok / done were 3.5–4.1:1 on white */
  --warn: #8F5A00;     --ok: #187A49;         --danger: #C2372F;   --info: #2F6FA8;
  --warn-fg: #FFFFFF;  --danger-fg: #FFFFFF;
  --done: #157468;     --done-fg: #FFFFFF;
  /* hairlines ON the hero surface: --border-strong vanished on it (round 2 step 5) */
  --border-hero: #D9DCE1; --border-strong-hero: #C3C8CF;
  --surface-hero: #FFFFFF; --surface-queue: #FAFBFB; --surface-ref: #F7F8F9;
  --phase-prep: #5B4FC4; --phase-prep-fg: #F0EDFF; --phase-prep-edge: #5B4FC4;
  --phase-out: #2F6FC8;  --phase-out-fg: #F3F7FE;
  --phase-intake: #1F7F8C; --phase-intake-fg: #EAF7F9;
  --meter-lit: #3A4048; --meter-off: #D9DCE1; --meter-off-hero: #D9DCE1; --field-edge: #C3C8CF;
  --meter-truck: #C94F8C;   /* a deeper rose on light: the pale one washes out on the off track */
  /* EACH PAGE'S STONE ON LIGHT (Tristan 2026-09-29, "C", from design/light-headers-2026-09-29/: the headers were "so light it looks
     really washed out"). The header stays white; the page's STONE (-deep here = the same Mineral pastel graphite uses for the
     current tab, so a page wears one stone in both themes) is a 4px rule under the header and the current tab's fill
     (UiStyles "LIGHT HEADERS" block). --v-<page> is the stone's dark INK: the phone header's icon, the tabs' current word, the
     wells' top edges and the write buttons' light. Measured: in Light the meaning colours (warn, ok, done, link, danger) are
     all mid-dark and saturated, so a coloured dark tab sat on one of them (a jade tab read "ok"); each ink is >= dE00 17 from
     every Light meaning colour and tape, and >= 4.6:1 on white and on its stone. The stones keep graphite's measurements
     (>= 17 from every state and tape, pages >= 11.3 apart; two gaps predate this: Today / Wall 4.4, moonstone 8.1 from white
     tape). The filled write button's words are >= 4.8:1 on every ink (they were 3.0:1 on Inventory's). Re-measure with
     node design/light-headers-2026-09-29/tools/directions.js */
  --v-today: #3A2C01; --v-today-deep: #D4C6A1;   /* sandstone · ink 13.6:1 on white, 8.0:1 on the stone, 21.6 from black tape */
  --v-gigs: #423872; --v-gigs-deep: #CFCAFF;   /* lapis · ink 10.3:1 on white, 6.6:1 on the stone, 17.1 from black tape */
  --v-projects: #501B00; --v-projects-deep: #FAB598;   /* coral · ink 14.0:1 on white, 8.1:1 on the stone, 22.5 from red tape */
  --v-board: #530839; --v-board-deep: #F3B0D3;   /* rose quartz · ink 14.4:1 on white, 8.2:1 on the stone, 23.1 from black tape */
  --v-inventory: #003822; --v-inventory-deep: #BEE6CF;   /* jade · ink 13.2:1 on white, 9.7:1 on the stone, 20.3 from done */
  --v-approvals: #49005C; --v-approvals-deep: #E9ADFE;   /* amethyst · ink 14.6:1 on white, 8.3:1 on the stone, 20 from black tape */
  --v-errors: #5A0317; --v-errors-deep: #FCB0B2;   /* rhodochrosite · ink 14.4:1 on white, 8.2:1 on the stone, 25.8 from black tape */
  --v-calendar: #263401; --v-calendar-deep: #B4D76B;   /* citrine · ink 13.3:1 on white, 8.2:1 on the stone, 24.4 from black tape */
  --v-tasks: #024E5B; --v-tasks-deep: #A0E1EE;   /* aquamarine · ink 9.4:1 on white, 6.5:1 on the stone, 17.1 from black tape */
  --v-notes: #1D341F; --v-notes-deep: #A0A8A0;   /* pewter · ink 13.4:1 on white, 5.5:1 on the stone, 18.6 from black tape */
  --v-feedback: #2A3201; --v-feedback-deep: #DEECB8;   /* peridot · ink 13.5:1 on white, 10.8:1 on the stone, 23.8 from black tape */
  --v-orders: #273311; --v-orders-deep: #B8C4A6;   /* prehnite · ink 13.4:1 on white, 7.3:1 on the stone, 21.2 from black tape */
  --v-wall: #3A2C01; --v-wall-deep: #E8D8B0;   /* travertine · ink 13.6:1 on white, 9.7:1 on the stone, 21.6 from black tape */
  --v-patches: #4F3858; --v-patches-deep: #BDA9C6;   /* lepidolite · ink 10.3:1 on white, 4.7:1 on the stone, 17 from black tape */
  --v-walls: #4E1A3E; --v-walls-deep: #C880B0;   /* kunzite · ink on white and on the stone */
  --v-installs: #2F2F45; --v-installs-deep: #9696A2;   /* slate · ink on white and on the stone: see the round's handoff */
  --v-news: #3E2A14; --v-news-deep: #B9946E;   /* tiger's eye · ink 13.6:1 on white, 4.9:1 on the stone */
  --v-reports: #1F3A4A; --v-reports-deep: #8FB3C4;   /* labradorite · ink 11.9:1 on white, 5.3:1 on the stone */
  --v-subrentals: #2E407C; --v-subrentals-deep: #C9D6E8;   /* moonstone · ink 9.8:1 on white, 6.7:1 on the stone, 17.1 from black tape */
  --v-config: #432420; --v-config-deep: #C6ADA9;   /* morganite · ink 13.9:1 on white, 6.6:1 on the stone, 17.9 from black tape */
  --v-registry: #341D5C; --v-registry-deep: #AA9BD4;   /* iolite · ink 14.2:1 on white, 5.7:1 on the stone, 17.1 from black tape */
  /* DEPARTMENTS on light (2026-09-29, Tristan: "yes" to tuning them): each keeps its Dark hue and sits where the bar is >= 3:1
     on white AND carries the dark body text at >= 4.5:1 (the bar's words are --fg on Light: UiStyles "LIGHT HEADERS" block).
     Dataviz validator on white, in this order: lightness band, chroma, adjacent CVD (worst 9.8 deutan) and normal-vision
     separation, contrast all pass; >= 16 from every Light meaning colour. All-pairs, Lighting / Staging sit 8.4 apart
     (Dark's Audio / Video 9.8): the department is always named beside its colour. Other stays a neutral grey, as in Dark.
     Re-measure with node design/light-headers-2026-09-29/tools/depts.js */
  --dept-audio: #4796F7; --dept-lighting: #959A20; --dept-video: #8F83E9; --dept-staging: #4EA72B; --dept-management: #E86191; --dept-other: #7C8289;
  color-scheme: light;
}
[data-theme="tungsten"] {
  /* ---- TUNGSTEN (Tristan's pick from the 2026-10-08 theme pitch; second cut 13:55 after "looks like a filter over graphite"): a 3200K key
     light and a cool fill. The floor is a deep warm brown, the wells a clear step up, and the hero is LIT (a lamp on the desk): three tiers
     further apart than graphite's. Whites are lamp-coloured, tracks and hairlines brass, links a pale blue fill so they still read as links
     against the warmth; warn a hotter amber. The halogen spill on the hero and the top of the page is UiStyles' [data-theme="tungsten"] rules.
     Page stones: its own brass-cast set (tools/theme-stones.js). Measured by tools/theme-contrast-test.js. ---- */
  --bg-base: #110C05;  --bg-raised: #241B0F;  --bg-sunken: #080502;
  --fg: #FFF7EC;       --fg-muted: #E8D6B6;   --fg-faint: #B9A581;   /* round 2 (Tristan): "text more white": the lamp tint is a hint now, not a colour (was #FFE9C4 / #D6B98A / #A08A62) */
  --border: #3A2C18;   --border-strong: #54412A;
  --accent: #93C3F2;   --accent-fg: #0A1724;
  --warn: #FFA114;     --ok: #8ADA9F;         --danger: #FF8A7A;   --info: #93C3F2;
  --warn-fg: #1A1200;  --danger-fg: #0B0C0E;
  --done: #4FD0B6;     --done-fg: #04211C;
  --border-hero: #7A6240; --border-strong-hero: #8E744E;
  --surface-hero: #4A3A22; --surface-queue: #1C150B; --surface-ref: #140F07;
  --phase-prep: #110C05; --phase-prep-fg: #D6B98A; --phase-prep-edge: #A08A62;
  --phase-out: #C2A270;  --phase-out-fg: #110C05;
  --phase-intake: #5A4628; --phase-intake-fg: #F6EAD4;
  --meter-lit: #FFF7EC; --meter-off: #5A4628; --meter-off-hero: #7A6240; --field-edge: #54412A;
  /* its own page stones (tools/theme-stones.js, 2026-10-08): the Mineral hues cast to this theme, each >= 15 dE00 from its meaning colours
     and every tape, >= 8 from the other pages (hue / deep tint). Regenerate with node tools/theme-stones.js --write */
  /* its own page stones (tools/theme-stones.js, 2026-10-08): the Mineral hues cast to this theme, each >= 15 dE00 from its meaning colours
     and every tape, >= 8 from the other pages (hue / deep tint). Regenerate with node tools/theme-stones.js --write */
  --v-today: #C1A995; --v-today-deep: #46280C;
  --v-gigs: #DAA0CE; --v-gigs-deep: #42243D;
  --v-projects: #F2C3A2; --v-projects-deep: #47270F;
  --v-board: #F0BECB; --v-board-deep: #49222E;
  --v-inventory: #AFB094; --v-inventory-deep: #333308;
  --v-approvals: #C0A5B6; --v-approvals-deep: #44233A;
  --v-errors: #E7958C; --v-errors-deep: #4A2320;
  --v-calendar: #D6D09B; --v-calendar-deep: #363106;
  --v-tasks: #9AB6A4; --v-tasks-deep: #0F3924;
  --v-notes: #ABB66A; --v-notes-deep: #2F340B;
  --v-feedback: #D3C4A9; --v-feedback-deep: #3F2D04;
  --v-orders: #CAD2B5; --v-orders-deep: #2D340D;
  --v-wall: #EAC892; --v-wall-deep: #402C05;
  --v-subrentals: #D8C1FE; --v-subrentals-deep: #362849;
  --v-installs: #DDC4E2; --v-installs-deep: #3E2643;
  --v-walls: #D6B5AF; --v-walls-deep: #4A231E;
  --v-news: #D5A27B; --v-news-deep: #47280E;
  --v-reports: #91B6B8; --v-reports-deep: #01383A;
  --v-config: #F7BFAD; --v-config-deep: #4A2419;
  --v-registry: #D999AB; --v-registry-deep: #49222E;
  --v-patches: #F9ABCC; --v-patches-deep: #472333;
  color-scheme: dark;
}
[data-theme="worklight"] {
  /* ---- WORKLIGHT (Tristan's pick, 2026-10-08): the blue clip lights backstage. Near-black navy, an electric blue for links, cool white
     words; the attention colours a step warmer so they separate from the blue field. Page stones: graphite's. ---- */
  --bg-base: #06101F;  --bg-raised: #0C1A30;  --bg-sunken: #030A16;
  --fg: #EAF1FF;       --fg-muted: #AEBDD9;   --fg-faint: #7A8EB0;
  --border: #16294B;   --border-strong: #243C6E;

<style>
  /* The crew member's own page (CrewPage.gs, round 5): a phone page, no sign-in, built onto bsiproduction.github.io/me/ by
     tools/build-me-page.js. Their next calls, this week's hours, "I missed a punch". Graphite, as the app; big type like the clock. */
  html, body { margin: 0; background: var(--bg-base); color: var(--fg); font-family: Montserrat, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  .me { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
  .me-top { display: grid; gap: 2px; }
  .me-mark { color: var(--fg-muted); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: 30px; margin: 0; }
  section { background: var(--bg-raised); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  h2 { font-size: 18px; margin: 0; display: flex; gap: 8px; align-items: baseline; }
  h2 .n { font: 500 14px 'IBM Plex Mono', monospace; color: var(--fg-muted); }
  .row { display: grid; gap: 3px; padding-top: 12px; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .nm { font-weight: 600; font-size: 17px; }
  .sub { color: var(--fg-muted); font-size: 15px; }
  .num { font-variant-numeric: tabular-nums; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .days { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .days div { background: var(--bg-sunken); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; font-size: 15px; }
  .state { font-size: 14px; font-weight: 600; }
  .state.ok { color: var(--fg); } .state.no { color: var(--warn); }   /* a list's states: plain words, amber only for a problem (done teal is for moments) */
  .open { border-left: 3px solid var(--warn); padding-left: 10px; }
  /* who else is on the call (Config CREW_PAGE_TEAM, 10/19): folded under the call, one person a line, their phone a link */
  .team { margin-top: 4px; }
  .team summary { cursor: pointer; color: var(--fg); font-size: 15px; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
  .team summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .who { font-size: 15px; padding: 6px 0; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .who a { color: var(--fg); min-height: 44px; display: inline-flex; align-items: center; }
  label { display: grid; gap: 6px; font-size: 15px; color: var(--fg-muted); }
  .field { font: 500 17px Montserrat, sans-serif; color: var(--fg); background: var(--bg-sunken); border: 1px solid var(--border-strong); border-radius: 10px; padding: 12px; min-height: 52px; width: 100%; box-sizing: border-box; }
  textarea.field { min-height: 80px; resize: vertical; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  button { font: 600 17px Montserrat, sans-serif; min-height: 52px; border-radius: 12px; cursor: pointer; padding: 0 18px; }
  .primary { background: var(--fg); color: var(--bg-base); border: 0; }
  .quiet { background: none; color: var(--fg); border: 1px solid var(--border-strong); }
  button[disabled] { opacity: .5; cursor: default; }
  button:focus-visible, .field:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .res { font-size: 15px; padding: 10px 12px; border-radius: 10px; background: var(--bg-sunken); }
  .res.ok { color: var(--done); } .res.bad { color: var(--warn); }
  .foot { color: var(--fg-faint); font-size: 13px; text-align: center; }
  .msg { text-align: center; padding: 40px 8px; font-size: 18px; color: var(--fg-muted); }
</style>

<script>window.BSI_ME = {"api":"https://script.google.com/macros/s/AKfycbwqyQVGhEKMc4YFw-KLpFeyYXPGiz9-70erdx9bAB_TOZGIv2GsOaoMIbNxLmDhzz5u/exec"};</script>
<main class="me" id="me" aria-live="polite"><div class="msg">Loading your page…</div></main>
<script>
(function () {
  'use strict';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const day = k => { const d = new Date(k + 'T12:00:00'); return isNaN(d) ? k : DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); };   // "Fri Oct 2", the app's day
  const t12 = t => { if (!/^\d\d:\d\d$/.test(t || '')) return t || ''; const h = +t.slice(0, 2), m = t.slice(3, 5); return (h % 12 || 12) + (m === '00' ? '' : ':' + m) + (h < 12 ? ' AM' : ' PM'); };
  const hrs = h => (Math.round(h * 100) / 100).toString().replace(/\.0+$/, '');
  const errText = e => (e && e.message) || String(e);
  let store = null; try { store = window.localStorage; } catch (e) { store = null; }
  // the link: #<40 hex> (kept on this phone too, so the page opens from the Home Screen without it)
  const hm = location.hash.match(/([a-f0-9]{40})/);
  let token = hm ? hm[1] : ''; try { if (token && store) store.setItem('bsi.me', token); if (!token && store) token = store.getItem('bsi.me') || ''; } catch (e) { /* private window */ }
  const fx = window.UI_USE_FIXTURE && window.UI_FIXTURES && window.UI_FIXTURES[window.UI_USE_FIXTURE];
  /** The office's answer: a fixture in a local preview (tools/ui-preview.js), else the BSI Clock API (clockApi → CrewPage.gs). */
  function call(op, args) {
    if (fx) return new Promise((ok, bad) => setTimeout(() => { try { const f = fx['me.' + op]; if (!f) throw new Error('no fixture for ' + op); ok(typeof f === 'function' ? f(args) : f); } catch (e) { bad(e); } }, 30));
    if (!window.BSI_ME || !window.BSI_ME.api) return Promise.reject(new Error('This page isn\'t set up yet.'));
    if (!token) return Promise.reject(new Error('This link isn\'t complete. Open it again from the message the office sent.'));
    return fetch(window.BSI_ME.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'me', token: token, op: op, args: args || {} }), redirect: 'follow' })
      .then(r => { if (!r.ok) throw new Error('Couldn\'t reach the office (' + r.status + '). Try again in a minute.'); return r.json(); })
      .then(j => { if (!j || j.ok !== true) throw new Error((j && j.error) || 'No answer from the office.'); return j.data; });
  }
  const S = { m: null, err: '', form: null, busy: false, res: null };
  if (fx && fx.meState) Object.assign(S, JSON.parse(JSON.stringify(fx.meState)));

  function callsHtml(m) {
    const st = s => s === 'confirmed' ? '<span class="state ok">confirmed</span>' : s === 'cant' ? '<span class="state no">can\'t make it</span>' : '';
    return '<section aria-labelledby="h-calls"><h2 id="h-calls">Your next calls <span class="n">' + m.calls.length + '</span></h2>' +
      (m.calls.length ? m.calls.map(c => '<div class="row"><div class="nm">' + esc(c.gig) + '</div><div class="sub">' + day(c.date) + (c.role ? ' · ' + esc(c.role) : '') +
        (c.call ? ' · ' + (c.shop ? '' : 'call ') + t12(c.call) + (c.out ? '–' + t12(c.out) : '') : '') + (c.place ? ' · ' + esc(c.place) : '') + '</div>' +
        (c.tell ? '<div class="sub">' + esc(c.tell) + '</div>' : '') + (c.brief ? '<div class="sub">' + esc(c.brief) + '</div>' : '') + st(c.state) + teamHtml(c) + '</div>').join('')
        : '<div class="sub">No calls coming up. The office adds you to a call sheet and sends it.</div>') + '</section>';
  }
  /** Who else is on this call (CrewPage.gs cpTeam_, Config CREW_PAGE_TEAM): folded; a name, their role(s), their call when it isn't
   *  yours, their phone (tap to call); then the roles still to fill. Nothing when the office has it off (no team). */
  function teamHtml(c) {
    const t = c.team; if (!t || (!(t.people || []).length && !(t.open || []).length)) return '';
    const n = t.people.length;
    return '<details class="team"' + (S.teamOpen ? ' open' : '') + '><summary>Who\'s on it' + (n ? ' (' + n + ' other' + (n === 1 ? '' : 's') + ')' : ' (nobody else yet)') + '</summary>' +
      t.people.map(p => '<div class="who"><b>' + esc(p.name) + '</b><span class="sub">' + esc((p.roles || []).join(', ')) + (p.call ? ' · call ' + t12(p.call) : '') + '</span>' +
        (p.phone ? '<a href="tel:' + esc(String(p.phone).replace(/[^\d+]/g, '')) + '">' + esc(p.phone) + '</a>' : '') + '</div>').join('') +
      (t.open.length ? '<div class="sub">Still to fill: ' + esc(t.open.map(o => o.role + (o.n > 1 ? ' × ' + o.n : '')).join(', ')) + '</div>' : '') + '</details>';
  }
  function weekHtml(m) {
    const w = m.week, open = w.open || [];
    return '<section aria-labelledby="h-week"><h2 id="h-week">This week</h2><div class="sub">' + day(w.from) + ' to ' + day(w.to) + '</div>' +
      '<div><span class="big">' + hrs(w.total) + '</span> <span class="sub">hours so far</span></div>' +
      (w.days.length ? '<div class="days">' + w.days.map(d => '<div><span class="sub">' + day(d.date).slice(0, 3) + ' ' + day(d.date).slice(8) + '</span><b class="num">' + hrs(d.hours) + ' h</b></div>').join('') + '</div>' : '') +
      open.map(p => '<div class="row open"><div class="nm">Punched in since ' + t12(p.in.slice(11)) + (p.in.slice(0, 10) !== m.now.slice(0, 10) ? ' on ' + day(p.in.slice(0, 10)) : '') + '</div><div class="sub">' + esc(p.gig) + '</div>' +
        (S.form && S.form.punchId === p.punchId ? '' : '<button type="button" class="quiet" onclick="ME.openOut(\'' + esc(p.punchId) + '\')">I forgot to punch out</button>') + '</div>').join('') +
      '<div class="sub">Rounded the way the clock rounds them. The office\'s timesheet is the final word.</div></section>';
  }
  function formHtml(m) {
    const f = S.form;
    if (!f) return '<section aria-labelledby="h-miss"><h2 id="h-miss">Missed a punch?</h2><div class="sub">Forgot to punch in or out? Tell the office here; your hours change once they approve it.</div>' +
      '<button type="button" class="quiet" onclick="ME.openMiss()">I missed a punch</button>' + resHtml() + '</section>';
    const sel = (name, opts, v) => '<select class="field" id="f-' + name + '" onchange="ME.set(\'' + name + '\', this.value)">' + opts.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
    const pickDay = m.pick.filter(p => p.date === f.day)[0] || m.pick[0];
    const body = f.punchId ? '<label for="f-out">When did you leave?<input class="field" id="f-out" type="time" value="' + esc(f.out) + '" onchange="ME.set(\'out\', this.value)"></label>'
      : '<label for="f-day">Which day' + sel('day', m.pick.map(p => [p.date, day(p.date)]), f.day) + '</label>' +
        '<label for="f-gigId">Which gig' + sel('gigId', pickDay.gigs.map(g => [g.id, g.name]).concat([['', 'Shop work (no gig)']]), f.gigId) + '</label>' +
        '<div class="two"><label for="f-in">Came in<input class="field" id="f-in" type="time" value="' + esc(f.in) + '" onchange="ME.set(\'in\', this.value)"></label>' +
        '<label for="f-out">Left<input class="field" id="f-out" type="time" value="' + esc(f.out) + '" onchange="ME.set(\'out\', this.value)"></label></div>';
    return '<section aria-labelledby="h-miss"><h2 id="h-miss">' + (f.punchId ? 'Forgot to punch out' : 'I missed a punch') + '</h2>' + body +
      '<label for="f-note">Anything the office should know (optional)<textarea class="field" id="f-note" maxlength="200" oninput="ME.set(\'note\', this.value)">' + esc(f.note) + '</textarea></label>' +
      '<div class="two"><button type="button" class="primary" onclick="ME.send()"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Sending…' : 'Send to the office') + '</button>' +
      '<button type="button" class="quiet" onclick="ME.close()"' + (S.busy ? ' disabled' : '') + '>Cancel</button></div>' + resHtml() + '</section>';
  }
  const resHtml = () => S.res ? '<div class="res ' + (S.res.ok ? 'ok' : 'bad') + '" role="status">' + esc(S.res.text) + '</div>' : '';
  function reqsHtml(m) {
    if (!m.requests.length) return '';
    const st = s => s === 'Approved' ? '<span class="state ok">approved</span>' : s === 'Rejected' ? '<span class="state no">not approved: ask the office</span>' : '<span class="state">waiting for the office</span>';
    return '<section aria-labelledby="h-req"><h2 id="h-req">What you asked for <span class="n">' + m.requests.length + '</span></h2>' +
      m.requests.map(r => '<div class="row"><div class="nm">' + day(r.day) + ' · ' + esc(r.gig) + '</div><div class="sub">' + (r.in ? t12(r.in) + '–' : 'out at ') + t12(r.out) + (r.note ? ' · ' + esc(r.note) : '') + '</div>' + st(r.status) + '</div>').join('') + '</section>';
  }
  function draw() {
    const el = document.getElementById('me');
    if (S.err && !S.m) { el.innerHTML = '<div class="msg">' + esc(S.err) + '</div>'; return; }
    if (!S.m) { el.innerHTML = '<div class="msg">Loading your page…</div>'; return; }
    const m = S.m;
    el.innerHTML = '<div class="me-top"><span class="me-mark">BSI Production</span><h1>Hi ' + esc(m.first) + '</h1></div>' +
      callsHtml(m) + weekHtml(m) + formHtml(m) + reqsHtml(m) + '<p class="foot">Only you see this page. Hours only, never pay. Questions: call the office.</p>';
  }
  function load() { call('model').then(m => { S.m = m; S.err = ''; draw(); }).catch(e => { S.err = errText(e); draw(); }); }
  window.ME = {
    openMiss: () => { const p = S.m.pick[0] || { date: '', gigs: [] }; S.form = { day: p.date, gigId: p.gigs.length ? p.gigs[0].id : '', in: '', out: '', note: '', punchId: '' }; S.res = null; draw(); },
    openOut: id => { S.form = { punchId: id, out: '', note: '' }; S.res = null; draw(); },
    close: () => { S.form = null; S.res = null; draw(); },
    set: (k, v) => { S.form[k] = v; if (k === 'day') { const p = S.m.pick.filter(x => x.date === v)[0]; S.form.gigId = p && p.gigs.length ? p.gigs[0].id : ''; draw(); } },
    send: () => {
      if (S.busy) return;
      const f = S.form;
      if (!f.out || (!f.punchId && !f.in)) { S.res = { ok: false, text: f.punchId ? 'Say when you left.' : 'Say when you came in and when you left.' }; draw(); return; }
      S.busy = true; S.res = null; draw();
      call('missed', f).then(r => { S.busy = false; S.form = null; S.res = { ok: true, text: r.what }; if (r.model) S.m = r.model; draw(); })
        .catch(e => { S.busy = false; S.res = { ok: false, text: errText(e) }; draw(); });
    } };
  if (S.m) draw(); else load();
})();
</script>
</body>
</html>
